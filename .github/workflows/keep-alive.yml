name: keep-alive

# Streamlit Community Cloud puts free apps to sleep after ~12 h without visitors.
# This job opens the app in a real browser every 8 h and wakes it up if it is asleep.
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install playwright && playwright install --with-deps chromium
      - run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          URL = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("App was asleep: waking it up")
                  wake.click()
                  page.wait_for_timeout(30000)
              else:
                  print("App is awake")
                  page.wait_for_timeout(8000)
              browser.close()
          EOF
        env:
          APP_URL: https://facial-parts-segmentation.streamlit.app/
